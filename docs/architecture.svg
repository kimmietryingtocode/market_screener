<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Portfolio platform architecture</title>
  <desc>A browser sends a request to the FastAPI backend, which reads/writes Postgres and calls the Python quant service for analytics; the quant service fetches market data from Yahoo Finance.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="270" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Browser / dashboard</text>

  <line x1="340" y1="64" x2="340" y2="106" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="88" font-family="sans-serif" font-size="12" fill="#5f5e5a">REST + JWT</text>

  <!-- FastAPI backend container -->
  <rect x="60" y="110" width="560" height="160" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="80" y="138" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">FastAPI backend</text>
  <text x="80" y="156" font-family="sans-serif" font-size="12" fill="#0C447C">Auth, portfolios, holdings</text>

  <!-- Auth + CRUD box -->
  <rect x="80" y="175" width="220" height="70" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.75"/>
  <text x="190" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Auth + portfolio CRUD</text>
  <text x="190" y="220" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">JWT, validation, ownership</text>

  <line x1="300" y1="210" x2="420" y2="210" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="202" font-family="sans-serif" font-size="12" fill="#5f5e5a">holdings</text>

  <!-- Quant service call box -->
  <rect x="420" y="175" width="180" height="70" rx="10" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.75"/>
  <text x="510" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Quant service call</text>
  <text x="510" y="220" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">HTTP POST /analytics</text>

  <line x1="190" y1="245" x2="190" y2="290" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="245" x2="510" y2="290" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect x="80" y="294" width="220" height="60" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="190" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Postgres</text>
  <text x="190" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">users, portfolios, holdings</text>

  <!-- Python quant service -->
  <rect x="400" y="294" width="220" height="60" rx="12" fill="#CECBF6" stroke="#534AB7" stroke-width="0.75"/>
  <text x="510" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Python quant service</text>
  <text x="510" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">FastAPI, stateless</text>

  <line x1="510" y1="354" x2="510" y2="390" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="382" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5f5e5a">price history</text>

  <!-- Yahoo Finance -->
  <rect x="420" y="392" width="180" height="20" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="510" y="402" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2C2C2A">Yahoo Finance (yfinance)</text>
</svg>
