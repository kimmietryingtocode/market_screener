scoring:
  method: cross_sectional_percentile
  rebalance_lag_periods: 1

normalization:
  method: winsorized_zscore
  lower_quantile: 0.05
  upper_quantile: 0.95
  output_min: 0
  output_max: 100

factors:
  momentum:
    column: momentum_3m
    higher_is_better: true
    weight: 0.30
  growth:
    column: revenue_growth
    higher_is_better: true
    weight: 0.25
  quality:
    column: operating_margin
    higher_is_better: true
    weight: 0.20
  estimate_revision:
    column: estimate_revision
    higher_is_better: true
    weight: 0.15
  valuation:
    column: forward_pe
    higher_is_better: false
    weight: 0.10

final_score:
  ranking_method: percentile_rank
  output_min: 0
  output_max: 100
