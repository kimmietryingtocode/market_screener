backtest:
  name: weekly_long_only_factor_strategy
  initial_capital: 1000000
  currency: USD

dates:
  start_date: null
  end_date: null

portfolio:
  construction: long_only_top_ranked
  max_positions: 25
  min_positions: 10
  position_weighting: equal_weight
  max_position_weight: 0.05
  sector_neutral: false
  max_sector_weight: 0.35

rebalance:
  frequency: weekly
  lag_periods: 1
  trade_at: close

costs:
  commission_bps: 0.0
  slippage_bps: 5.0

risk:
  benchmark: SPY
  cash_ticker: CASH
  allow_short: false
  allow_leverage: false
  max_gross_exposure: 1.0

outputs:
  trades_path: output/backtest/trades.csv
  holdings_path: output/backtest/holdings.csv
  performance_path: output/backtest/performance.csv
