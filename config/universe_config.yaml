universe:
  name: us_equities_core
  description: Core US equity universe for weekly signal generation.

data:
  raw_factset_export: data/manual_factset/factset_export.csv
  processed_prices: data/processed/prices.csv
  signals_output: data/signals/signals.csv

identifiers:
  ticker_column: ticker
  date_column: date

filters:
  min_price: 5.0
  min_market_cap_usd: 1000000000
  min_average_daily_volume_usd: 5000000
  require_sector: true
  exclude_security_types:
    - ETF
    - ETN
    - ADR
    - Closed-End Fund
    - Preferred

required_fields:
  - date
  - ticker
  - close
  - momentum_3m
  - revenue_growth
  - operating_margin
  - forward_pe
  - estimate_revision
